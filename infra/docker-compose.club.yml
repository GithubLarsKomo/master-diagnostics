services:
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
    depends_on:
      libsql:
        condition: service_healthy
    networks: [internal]

  privacy-check:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    env_file: ../.env
    command: ["pnpm", "--filter", "@masters/db", "privacy-capabilities:check"]
    networks: [internal]

  export-cleanup:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
    command: ["sh", "-c", "set -e; while true; do pnpm --filter @masters/db tenant-exports:cleanup; pnpm --filter @masters/db data-subject-delivery:cleanup; sleep 3600; done"]
    volumes:
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  retention-scan:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      RETENTION_JOB_OUTPUT: summary
    command: ["sh", "-c", "set -e; while true; do pnpm --silent --filter @masters/db retention:scan; sleep 86400; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  backup-bundle:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      BACKUP_SOURCE_DIR: /backup-source
      BACKUP_TARGET_DIR: /backup-target
      BACKUP_KEY_FILE: /run/secrets/backup.key
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-30}
    command: ["pnpm", "--filter", "@masters/db", "backup:bundle"]
    volumes:
      - libsql-data:/backup-source/libsql:ro
      - report-data:/backup-source/reports:ro
      - export-data:/backup-source/tenant-exports:ro
      - data-subject-delivery-data:/backup-source/data-subject-delivery:ro
      - caddy-data:/backup-source/caddy-data:ro
      - caddy-config:/backup-source/caddy-config:ro
      - ${BACKUP_HOST_DIR:-/var/backups/master-diagnostics}:/backup-target
      - ${BACKUP_KEY_FILE:-/etc/master-diagnostics/backup.key}:/run/secrets/backup.key:ro

  backup-verify:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      BACKUP_KEY_FILE: /run/secrets/backup.key
    command: ["pnpm", "--filter", "@masters/db", "backup:verify"]
    volumes:
      - ${BACKUP_HOST_DIR:-/var/backups/master-diagnostics}:/backup-target:ro
      - ${BACKUP_KEY_FILE:-/etc/master-diagnostics/backup.key}:/run/secrets/backup.key:ro

  backup-restore-stage:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      BACKUP_KEY_FILE: /run/secrets/backup.key
      RESTORE_STAGING_ROOT: /restore-staging
    command: ["pnpm", "--filter", "@masters/db", "backup:stage"]
    volumes:
      - ${BACKUP_HOST_DIR:-/var/backups/master-diagnostics}:/backup-target:ro
      - ${BACKUP_KEY_FILE:-/etc/master-diagnostics/backup.key}:/run/secrets/backup.key:ro
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging

  backup-privacy-ledger:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      RESTORE_PRIVACY_LEDGER_DIR: /privacy-ledger
      RESTORE_PRIVACY_LEDGER_KEY_FILE: /run/secrets/restore-privacy-ledger.key
    command: ["pnpm", "--filter", "@masters/db", "backup:privacy-ledger"]
    volumes:
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging:ro
      - ${RESTORE_PRIVACY_LEDGER_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-ledger}:/privacy-ledger
      - ${RESTORE_PRIVACY_LEDGER_KEY_FILE:-/etc/master-diagnostics/restore-privacy-ledger.key}:/run/secrets/restore-privacy-ledger.key:ro
    depends_on:
      libsql:
        condition: service_healthy
    networks: [internal]

  backup-privacy-reconcile:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      RESTORE_PRIVACY_LEDGER_DIR: /privacy-ledger
      RESTORE_PRIVACY_LEDGER_KEY_FILE: /run/secrets/restore-privacy-ledger.key
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
    command: ["pnpm", "--filter", "@masters/db", "backup:privacy-reconcile"]
    volumes:
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging:ro
      - ${RESTORE_PRIVACY_LEDGER_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-ledger}:/privacy-ledger:ro
      - ${RESTORE_PRIVACY_LEDGER_KEY_FILE:-/etc/master-diagnostics/restore-privacy-ledger.key}:/run/secrets/restore-privacy-ledger.key:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/privacy-effect-journal:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro

  backup-privacy-replay-db:
    profiles: [backup]
    image: ghcr.io/tursodatabase/libsql-server:3ec6803
    restart: "no"
    environment:
      SQLD_NODE: primary
    volumes:
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}/libsql:/var/lib/sqld
    networks: [restore-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  backup-privacy-replay-migrate:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: http://backup-privacy-replay-db:8080
      DATABASE_AUTH_TOKEN: ""
    command: ["pnpm", "--filter", "@masters/db", "db:migrate"]
    depends_on:
      backup-privacy-replay-db:
        condition: service_healthy
    networks: [restore-internal]

  backup-privacy-replay:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: http://backup-privacy-replay-db:8080
      DATABASE_AUTH_TOKEN: ""
      RESTORE_PRIVACY_LEDGER_DIR: /privacy-ledger
      RESTORE_PRIVACY_LEDGER_KEY_FILE: /run/secrets/restore-privacy-ledger.key
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
    command: ["pnpm", "--filter", "@masters/db", "backup:privacy-replay-db"]
    volumes:
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging:ro
      - ${RESTORE_PRIVACY_LEDGER_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-ledger}:/privacy-ledger:ro
      - ${RESTORE_PRIVACY_LEDGER_KEY_FILE:-/etc/master-diagnostics/restore-privacy-ledger.key}:/run/secrets/restore-privacy-ledger.key:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/privacy-effect-journal:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro
    depends_on:
      backup-privacy-replay-migrate:
        condition: service_completed_successfully
    networks: [restore-internal]

  app:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      NEXT_PUBLIC_APP_URL: https://${APP_HOST}
      BETTER_AUTH_URL: https://${APP_HOST}
      REPORT_STORAGE_DIR: /var/lib/masters/reports
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /var/lib/masters/restore-privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
    volumes:
      - report-data:/var/lib/masters/reports
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/var/lib/masters/restore-privacy-effect-journal
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      privacy-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:3ec6803
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
  restore-internal:
    internal: true
volumes:
  libsql-data:
  report-data:
  export-data:
  data-subject-delivery-data:
  caddy-data:
  caddy-config:

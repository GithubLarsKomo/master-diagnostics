services:
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
    depends_on:
      libsql:
        condition: service_healthy
    networks: [internal]

  privacy-check:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    env_file: ../.env
    command: ["pnpm", "--filter", "@masters/db", "privacy-capabilities:check"]
    networks: [internal]

  export-cleanup:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
    command: ["sh", "-c", "set -e; while true; do pnpm --filter @masters/db tenant-exports:cleanup; pnpm --filter @masters/db data-subject-delivery:cleanup; sleep 3600; done"]
    volumes:
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  retention-scan:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      RETENTION_JOB_OUTPUT: summary
    command: ["sh", "-c", "set -e; while true; do pnpm --filter @masters/db retention:scan; sleep 86400; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: http://libsql:8080
      NEXT_PUBLIC_APP_URL: https://${APP_HOST}
      BETTER_AUTH_URL: https://${APP_HOST}
      REPORT_STORAGE_DIR: /var/lib/masters/reports
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
    volumes:
      - report-data:/var/lib/masters/reports
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
    depends_on:
      migrate:
        condition: service_completed_successfully
      privacy-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
volumes:
  libsql-data:
  report-data:
  export-data:
  data-subject-delivery-data:
  caddy-data:
  caddy-config:

services:
  backup-restore-promotion-intent:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: http://backup-privacy-replay-db:8080
      DATABASE_AUTH_TOKEN: ""
      RESTORE_PRIVACY_LEDGER_DIR: /privacy-ledger
      RESTORE_PRIVACY_LEDGER_KEY_FILE: /run/secrets/restore-privacy-ledger.key
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
      RESTORE_PRIVACY_ARTIFACT_MANIFEST_FILE: /restore-replay/artifact-replay-manifest.json
      RESTORE_PRIVACY_ARTIFACT_RESULT_FILE: /restore-replay/artifact-replay-result.json
      RESTORE_PRIVACY_REPORT_ROOT: /restore-replay/reports
      RESTORE_PRIVACY_TENANT_EXPORT_ROOT: /restore-replay/tenant-exports
      RESTORE_PRIVACY_DATA_SUBJECT_DELIVERY_ROOT: /restore-replay/data-subject-delivery
      RESTORE_PRIVATE_RECOVERY_PLAN_FILE: /restore-replay/recovery-plan.json
      RESTORE_PRIVATE_RECOVERY_INTENT_DIR: /restore-replay/recovery-execution
      RESTORE_PRIVATE_PROMOTION_INTENT_DIR: /restore-replay/promotion
      RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE: /run/secrets/restore-private-promotion.key
    command: ["pnpm", "--filter", "@masters/db", "backup:restore-promotion-intent"]
    volumes:
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging:ro
      - ${RESTORE_PRIVACY_LEDGER_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-ledger}:/privacy-ledger:ro
      - ${RESTORE_PRIVACY_LEDGER_KEY_FILE:-/etc/master-diagnostics/restore-privacy-ledger.key}:/run/secrets/restore-privacy-ledger.key:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/privacy-effect-journal:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro
      - ${RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE:-/etc/master-diagnostics/restore-private-promotion.key}:/run/secrets/restore-private-promotion.key:ro
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}:/restore-replay:ro
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}/promotion:/restore-replay/promotion
    depends_on:
      backup-privacy-replay-db:
        condition: service_healthy
    networks: [restore-internal]

  backup-restore-promotion-plan:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: http://backup-privacy-replay-db:8080
      DATABASE_AUTH_TOKEN: ""
      RESTORE_PRIVACY_LEDGER_DIR: /privacy-ledger
      RESTORE_PRIVACY_LEDGER_KEY_FILE: /run/secrets/restore-privacy-ledger.key
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
      RESTORE_PRIVACY_ARTIFACT_MANIFEST_FILE: /restore-replay/artifact-replay-manifest.json
      RESTORE_PRIVACY_ARTIFACT_RESULT_FILE: /restore-replay/artifact-replay-result.json
      RESTORE_PRIVACY_REPORT_ROOT: /restore-replay/reports
      RESTORE_PRIVACY_TENANT_EXPORT_ROOT: /restore-replay/tenant-exports
      RESTORE_PRIVACY_DATA_SUBJECT_DELIVERY_ROOT: /restore-replay/data-subject-delivery
      RESTORE_PRIVATE_RECOVERY_PLAN_FILE: /restore-replay/recovery-plan.json
      RESTORE_PRIVATE_RECOVERY_INTENT_DIR: /restore-replay/recovery-execution
      RESTORE_PRIVATE_PROMOTION_INTENT_DIR: /restore-replay/promotion
      RESTORE_PRIVATE_PROMOTION_INTENT_FILE: /restore-replay/promotion/promotion-intent.json
      RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE: /run/secrets/restore-private-promotion.key
    command: ["pnpm", "--filter", "@masters/db", "backup:restore-promotion-plan"]
    volumes:
      - ${RESTORE_STAGING_HOST_DIR:-/var/lib/master-diagnostics/restore-staging}:/restore-staging:ro
      - ${RESTORE_PRIVACY_LEDGER_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-ledger}:/privacy-ledger:ro
      - ${RESTORE_PRIVACY_LEDGER_KEY_FILE:-/etc/master-diagnostics/restore-privacy-ledger.key}:/run/secrets/restore-privacy-ledger.key:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/privacy-effect-journal:ro
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro
      - ${RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE:-/etc/master-diagnostics/restore-private-promotion.key}:/run/secrets/restore-private-promotion.key:ro
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}:/restore-replay:ro
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}/promotion:/restore-replay/promotion
    depends_on:
      backup-privacy-replay-db:
        condition: service_healthy
    networks: [restore-internal]

  backup-restore-promotion-candidate-copy:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrator
    restart: "no"
    command: ["pnpm", "--filter", "@masters/db", "backup:restore-promotion-candidate-copy"]
    volumes:
      - ${RESTORE_PRIVACY_REPLAY_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-replay}/${RESTORE_STAGING_NAME:-restore-unset}:/restore-replay:ro
      - restore-promotion-candidate:/candidate
    network_mode: none

volumes:
  restore-promotion-candidate:
    external: true
    name: ${RESTORE_PRIVATE_PROMOTION_CANDIDATE_VOLUME:-restore-promotion-candidate-unset}

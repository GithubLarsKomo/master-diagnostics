services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
    ports:
      - "8080:8080"
    volumes:
      - libsql-dev-data:/var/lib/sqld
    healthcheck:
      test: ["CMD-SHELL", "while read -r _ local _ state _; do case \"$${local}:$${state}\" in *:1F90:0A) exit 0;; esac; done < /proc/net/tcp; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  libsql-dev-data:

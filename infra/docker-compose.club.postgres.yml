services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-master_diagnostics}
      POSTGRES_USER: ${POSTGRES_USER:-master_diagnostics_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: postgres-ops
    restart: "no"
    env_file: ../.env
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_MIGRATIONS_DIR: migrations-postgres
    command: ["sh", "-ec", "cd /app/packages/db && node scripts/apply-postgres-migrations.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  privacy-check:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: postgres-ops
    restart: "no"
    env_file: ../.env
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["pnpm", "--filter", "@masters/db", "privacy-capabilities:check"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  export-cleanup:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: postgres-ops
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
    command: ["sh", "-c", "set -e; while true; do pnpm --filter @masters/db tenant-exports:cleanup; pnpm --filter @masters/db data-subject-delivery:cleanup; sleep 3600; done"]
    volumes:
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  retention-scan:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: postgres-ops
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RETENTION_JOB_OUTPUT: summary
    command: ["sh", "-c", "set -e; while true; do pnpm --silent --filter @masters/db retention:scan; sleep 86400; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  postgres-backup:
    profiles: [backup]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: postgres-ops
    restart: "no"
    env_file: ../.env
    environment:
      SOURCE_POSTGRES_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_KEY_FILE: /run/secrets/backup.key
      POSTGRES_BACKUP_DIR: /backup-target
      POSTGRES_DATABASE_OWNER: ${POSTGRES_USER:-master_diagnostics_app}
      POSTGRES_RUNTIME_ROLE: ${POSTGRES_USER:-master_diagnostics_app}
    command: ["pnpm", "--filter", "@masters/db", "postgres:backup:create"]
    volumes:
      - ${BACKUP_HOST_DIR:-/var/backups/master-diagnostics}:/backup-target
      - ${BACKUP_KEY_FILE:-/etc/master-diagnostics/backup.key}:/run/secrets/backup.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_APP_URL: https://${APP_HOST}
      BETTER_AUTH_URL: https://${APP_HOST}
      REPORT_STORAGE_DIR: /var/lib/masters/reports
      TENANT_EXPORT_STORAGE_DIR: /var/lib/masters/exports
      DATA_SUBJECT_DELIVERY_PACKAGE_ROOT: /var/lib/masters/data-subject-delivery-packages
      RESTORE_PRIVACY_EFFECT_JOURNAL_DIR: /var/lib/masters/restore-privacy-effect-journal
      RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE: /run/secrets/restore-privacy-effect-journal.key
    volumes:
      - report-data:/var/lib/masters/reports
      - export-data:/var/lib/masters/exports
      - data-subject-delivery-data:/var/lib/masters/data-subject-delivery-packages
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_HOST_DIR:-/var/lib/master-diagnostics/restore-privacy-effect-journal}:/var/lib/masters/restore-privacy-effect-journal
      - ${RESTORE_PRIVACY_EFFECT_JOURNAL_KEY_FILE:-/etc/master-diagnostics/restore-privacy-effect-journal.key}:/run/secrets/restore-privacy-effect-journal.key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      privacy-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    internal: true

volumes:
  postgres-data:
  report-data:
  export-data:
  data-subject-delivery-data:
  caddy-data:
  caddy-config:

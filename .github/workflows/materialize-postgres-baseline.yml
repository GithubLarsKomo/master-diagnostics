name: Materialize PostgreSQL Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/materialize-postgres-baseline.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical baseline
        run: |
          cd packages/db
          node scripts/generate-postgres-schema.mjs
          rm -rf migrations-postgres-ci migrations-postgres
          pnpm postgres:drizzle:generate
          mkdir -p migrations-postgres
          files=(migrations-postgres-ci/*.sql)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" migrations-postgres/0000_baseline.sql
          rm -rf migrations-postgres-ci
      - name: Commit baseline and remove one-shot workflow
        run: |
          rm .github/workflows/materialize-postgres-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/db/migrations-postgres/0000_baseline.sql .github/workflows/materialize-postgres-baseline.yml
          git commit -m 'Materialize canonical PostgreSQL baseline'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

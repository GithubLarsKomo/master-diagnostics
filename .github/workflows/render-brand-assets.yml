name: Render Brand Assets
on:
  push:
    branches: [feat/sport-brand-assets]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sport-brand-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render PNG derivatives
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          root=Path('apps/web/public')
          (root/'icons').mkdir(exist_ok=True)
          cairosvg.svg2png(url=str(root/'favicon.svg'),write_to=str(root/'favicon-32.png'),output_width=32,output_height=32)
          for size in (192,512,1024):
              cairosvg.svg2png(url=str(root/'brand/app-icon.svg'),write_to=str(root/f'icons/app-icon-{size}.png'),output_width=size,output_height=size)
          cairosvg.svg2png(url=str(root/'brand/logo-lockup.svg'),write_to=str(root/'brand/logo-lockup.png'),output_width=1320,output_height=320)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/public
          if ! git diff --cached --quiet; then
            git commit -m 'chore(brand): render PNG derivatives'
            git push origin HEAD:feat/sport-brand-assets
          fi

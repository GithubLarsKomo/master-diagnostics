name: Backup Privacy Activation Readiness Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-activation-readiness-contract.yml'
      - 'infra/backup/check-backup-privacy-activation-readiness.py'
      - 'infra/backup/check-club-backup-privacy-activation-readiness.sh'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'docs/backup-privacy-activation-readiness.md'
      - 'docs/restore-rto-drill.md'
      - 'TASKS.md'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-activation-readiness-contract.yml'
      - 'infra/backup/check-backup-privacy-activation-readiness.py'
      - 'infra/backup/check-club-backup-privacy-activation-readiness.sh'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'docs/backup-privacy-activation-readiness.md'
      - 'docs/restore-rto-drill.md'
      - 'TASKS.md'
      - '.env.example'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signed successful real-drill-shaped report
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-readiness
          rm -rf "$root"
          mkdir -p "$root/reports"
          chmod 700 "$root/reports"
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          root = Path('/tmp/backup-privacy-readiness')
          root.joinpath('drill.key').write_text(base64.b64encode(bytes([83]) * 32).decode() + '\n')
          phases = [
              {'name': name, 'status': 'COMPLETED', 'durationSeconds': 10, 'exitCode': 0}
              for name in (
                  'VERIFY_BACKUP','STAGE_RESTORE','PRIVACY_REPLAY','AUTHORIZE_PROMOTION',
                  'PREPARE_PROMOTION_PLAN','PREPARE_CANDIDATES','AUTHORIZE_SWITCH','EXECUTE_SWITCH'
              )
          ]
          root.joinpath('phases.json').write_text(json.dumps(phases) + '\n')
          PY
          chmod 600 "$root/drill.key" "$root/phases.json"
          python3 infra/backup/write-restore-rto-drill-report.py \
            --output-dir "$root/reports" \
            --key-file "$root/drill.key" \
            --drill-id drill-11111111111111111111111111111111 \
            --bundle-name masters-backup-20260809T100000Z-11111111-1111-1111-1111-111111111111.mdbak \
            --bundle-sha256 sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --staging-name restore-20260809T100100Z-22222222-2222-2222-2222-222222222222 \
            --candidate-set-id restore-0123456789abcdefabcd \
            --started-at 2026-08-09T10:00:00.000Z \
            --completed-at 2026-08-09T10:02:00.000Z \
            --duration-seconds 120 \
            --status COMPLETED \
            --terminal-phase EXECUTE_SWITCH \
            --phases-file "$root/phases.json" \
            >"$root/writer.json"

      - name: Verify successful report is ready only for manual attestation
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-readiness
          PRIVACY_BACKUP_STATE=DISABLED \
            python3 infra/backup/check-backup-privacy-activation-readiness.py \
              --report "$root/reports/drill-11111111111111111111111111111111.json" \
              --key-file "$root/drill.key" \
              >"$root/readiness.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/backup-privacy-readiness/readiness.json').read_text())
          assert result['mode']=='BACKUP_PRIVACY_ACTIVATION_READINESS'
          assert result['status']=='READY_FOR_MANUAL_ATTESTATION'
          assert result['drillReportVerified'] is True
          assert result['rtoMet'] is True
          assert result['privacyReconciliationProven'] is True
          assert result['controlledPromotionProven'] is True
          assert result['blockers']==[]
          assert result['automaticActivationPerformed'] is False
          assert result['privacyBackupActivationAllowed'] is False
          assert result['manualAttestationTarget']['PRIVACY_BACKUP_STATE']=='ENABLED'
          assert result['manualAttestationTarget']['PRIVACY_BACKUP_RESTORE_RECONCILIATION']=='true'
          PY

      - name: Verify HMAC tampering blocks readiness
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-readiness
          mkdir -p "$root/tampered"
          cp "$root/reports/drill-11111111111111111111111111111111.json" "$root/tampered/drill-22222222222222222222222222222222.json"
          chmod 600 "$root/tampered/drill-22222222222222222222222222222222.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/backup-privacy-readiness/tampered/drill-22222222222222222222222222222222.json')
          data=json.loads(path.read_text())
          data['record']['durationSeconds']=121
          path.write_text(json.dumps(data, indent=2)+'\n')
          PY
          set +e
          PRIVACY_BACKUP_STATE=DISABLED \
            python3 infra/backup/check-backup-privacy-activation-readiness.py \
              --report "$root/tampered/drill-22222222222222222222222222222222.json" \
              --key-file "$root/drill.key" \
              >"$root/tampered.json"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/backup-privacy-readiness/tampered.json').read_text())
          assert result['status']=='BLOCKED'
          assert 'DRILL_REPORT_FINGERPRINT_MISMATCH' in result['blockers']
          assert result['privacyBackupActivationAllowed'] is False
          PY

      - name: Verify incomplete or slow evidence cannot authorize readiness
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-readiness
          python3 - <<'PY'
          import json
          from pathlib import Path
          phases=json.loads(Path('/tmp/backup-privacy-readiness/phases.json').read_text())
          phases[-1]['status']='FAILED'
          phases[-1]['exitCode']=1
          Path('/tmp/backup-privacy-readiness/phases-failed.json').write_text(json.dumps(phases)+'\n')
          PY
          chmod 600 "$root/phases-failed.json"
          python3 infra/backup/write-restore-rto-drill-report.py \
            --output-dir "$root/reports" \
            --key-file "$root/drill.key" \
            --drill-id drill-33333333333333333333333333333333 \
            --bundle-name masters-backup-20260809T100000Z-11111111-1111-1111-1111-111111111111.mdbak \
            --bundle-sha256 sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --started-at 2026-08-09T10:00:00.000Z \
            --completed-at 2026-08-09T15:00:00.000Z \
            --duration-seconds 18000 \
            --status FAILED \
            --terminal-phase EXECUTE_SWITCH \
            --phases-file "$root/phases-failed.json" >/dev/null
          set +e
          PRIVACY_BACKUP_STATE=DISABLED \
            python3 infra/backup/check-backup-privacy-activation-readiness.py \
              --report "$root/reports/drill-33333333333333333333333333333333.json" \
              --key-file "$root/drill.key" >"$root/failed-readiness.json"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/backup-privacy-readiness/failed-readiness.json').read_text())
          assert r['status']=='BLOCKED'
          assert 'DRILL_NOT_COMPLETED' in r['blockers']
          assert 'RTO_TARGET_NOT_MET' in r['blockers']
          assert 'DRILL_PHASE_NOT_SUCCESSFUL' in r['blockers']
          PY

      - name: Verify premature ENABLED state is blocked
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-readiness
          set +e
          PRIVACY_BACKUP_STATE=ENABLED \
            python3 infra/backup/check-backup-privacy-activation-readiness.py \
              --report "$root/reports/drill-11111111111111111111111111111111.json" \
              --key-file "$root/drill.key" >"$root/enabled-readiness.json"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/backup-privacy-readiness/enabled-readiness.json').read_text())
          assert r['status']=='BLOCKED'
          assert r['blockers']==['BACKUP_CAPABILITY_NOT_DISABLED_DURING_READINESS_REVIEW']
          assert r['automaticActivationPerformed'] is False
          PY

      - name: Verify host wrapper and gate remain read-only
        run: |
          bash -n infra/backup/check-club-backup-privacy-activation-readiness.sh
          python3 - <<'PY'
          from pathlib import Path
          checker=Path('infra/backup/check-backup-privacy-activation-readiness.py').read_text()
          wrapper=Path('infra/backup/check-club-backup-privacy-activation-readiness.sh').read_text()
          combined=checker+'\n'+wrapper
          for token in (
              'docker compose up', 'docker compose down', 'docker compose stop',
              'docker volume create', 'docker volume rm', 'PRIVACY_BACKUP_STATE=ENABLED',
              'sed -i', 'write_text(', 'os.environ['
          ):
              if token == 'write_text(':
                  assert token not in checker
              elif token == 'os.environ[':
                  assert token not in checker
              else:
                  assert token not in combined
          assert 'PRIVACY_BACKUP_STATE' in checker
          assert 'privacyBackupActivationAllowed' in checker
          assert 'automaticActivationPerformed' in checker
          PY

      - name: Verify release gates remain open until a real host drill occurs
        run: |
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Privacy-Reconciliation, Healthcheck, kontrollierte Promotion und RTO praktisch testen' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md
          grep -F -- 'PRIVACY_BACKUP_STATE=DISABLED' .env.example

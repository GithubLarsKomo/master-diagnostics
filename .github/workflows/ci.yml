name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DEPLOYMENT_MODE: club
      AUTH_PROVIDER: better-auth
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      DATABASE_AUTH_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated algorithm references
        run: |
          python3 tools/generate_algorithm_reference.py
          python3 tools/generate_modified_dmax_reference.py
          git diff --exit-code -- \
            packages/diagnostics/reference/algorithm-reference-v1.json \
            packages/diagnostics/reference/algorithm-reference-v2.json \
            packages/diagnostics/reference/modified-dmax-reference-v1.json

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify independent Python diagnostic references
        run: |
          python3 packages/diagnostics/reference/verify_cubic_dmax_reference.py
          python3 packages/diagnostics/reference/verify_asymmetric_dmax_reference.py
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @masters/web exec playwright install --with-deps chromium
      - name: Prepare E2E database
        run: |
          rm -f "${{ github.workspace }}/ci.db"
          pnpm db:migrate
      - name: Run Playwright E2E
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee playwright-e2e.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: warn
          path: |
            playwright-e2e.log
            apps/web/playwright-report
            apps/web/test-results

  deployment-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment environment
        run: |
          cp .env.example .env
          sed -i 's/diagnostics.example.org/localhost/g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-only-secret-with-at-least-32-characters/' .env
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.club.yml config --quiet
      - name: Build migration image
        run: docker build --target migrator -f apps/web/Dockerfile -t master-diagnostics-migrator:ci .
      - name: Build production web image
        run: docker build --target runner -f apps/web/Dockerfile -t master-diagnostics-web:ci .

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DEPLOYMENT_MODE: club
      AUTH_PROVIDER: better-auth
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      DATABASE_AUTH_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @masters/web exec playwright install --with-deps chromium
      - name: Prepare E2E database
        run: |
          rm -f "${{ github.workspace }}/ci.db"
          pnpm db:migrate
      - name: Run Playwright E2E
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee playwright-e2e.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: warn
          path: |
            playwright-e2e.log
            apps/web/playwright-report
            apps/web/test-results

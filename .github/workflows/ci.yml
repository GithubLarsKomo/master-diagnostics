name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DEPLOYMENT_MODE: club
      AUTH_PROVIDER: better-auth
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      DATABASE_AUTH_TOKEN: ""
      PRIVACY_BACKUP_STATE: DISABLED
      PRIVACY_NOTIFICATIONS_STATE: DISABLED

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated algorithm references
        run: |
          python3 tools/generate_algorithm_reference.py
          python3 tools/generate_modified_dmax_reference.py
          git diff --exit-code -- \
            packages/diagnostics/reference/algorithm-reference-v1.json \
            packages/diagnostics/reference/algorithm-reference-v2.json \
            packages/diagnostics/reference/modified-dmax-reference-v1.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify backup host orchestrator syntax
        run: |
          bash -n infra/backup/create-club-backup.sh
          bash -n infra/backup/verify-club-backup.sh
          bash -n infra/backup/install-club-backup-timer.sh
          bash -n infra/backup/stage-club-restore.sh
          bash -n infra/backup/create-club-restore-privacy-ledger.sh
      - name: Verify runtime privacy capability attestation
        run: pnpm privacy-capabilities:check
      - name: Verify independent Python diagnostic references
        run: |
          python3 packages/diagnostics/reference/verify_cubic_dmax_reference.py
          python3 packages/diagnostics/reference/verify_asymmetric_dmax_reference.py
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @masters/web exec playwright install --with-deps chromium
      - name: Prepare E2E database
        run: |
          rm -f "${{ github.workspace }}/ci.db"
          pnpm db:migrate
      - name: Verify scheduled retention summary
        run: |
          RETENTION_JOB_OUTPUT=summary pnpm --silent --filter @masters/db retention:scan > /tmp/retention-summary.json
          python3 - <<'PY'
          import json

          with open('/tmp/retention-summary.json', encoding='utf-8') as handle:
              summary = json.load(handle)
          assert summary == {
              'mode': 'READ_ONLY',
              'assessedAt': summary['assessedAt'],
              'tenantCount': 0,
              'candidateCount': 0,
              'eligibleCount': 0,
              'manualReviewCount': 0,
          }
          assert set(summary) == {
              'mode', 'assessedAt', 'tenantCount', 'candidateCount',
              'eligibleCount', 'manualReviewCount',
          }
          PY
      - name: Verify signed restore privacy ledger CLI
        run: |
          mkdir -p /tmp/restore-staging/restore-ci /tmp/restore-privacy-ledger
          cat >/tmp/restore-staging/restore-ci/manifest.json <<'JSON'
          {
            "bundleVersion": 1,
            "createdAt": "2026-08-01T00:00:00.000Z",
            "restoreReconciliationRequired": true
          }
          JSON
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/restore-privacy-ledger.key').write_text(base64.b64encode(bytes([7]) * 32).decode() + '\n')
          PY
          chmod 600 /tmp/restore-privacy-ledger.key
          RESTORE_STAGING_MANIFEST=/tmp/restore-staging/restore-ci/manifest.json \
          RESTORE_PRIVACY_LEDGER_DIR=/tmp/restore-privacy-ledger \
          RESTORE_PRIVACY_LEDGER_KEY_FILE=/tmp/restore-privacy-ledger.key \
            pnpm --silent --filter @masters/db backup:privacy-ledger > /tmp/restore-privacy-ledger-summary.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          with open('/tmp/restore-privacy-ledger-summary.json', encoding='utf-8') as handle:
              summary = json.load(handle)
          assert summary['envelopeVersion'] == 1
          assert summary['ledgerVersion'] == 1
          assert summary['sinceExclusive'] == '2026-08-01T00:00:00.000Z'
          assert summary['entryCount'] == 0
          assert summary['entriesFingerprint'].startswith('sha256:')
          assert summary['created'] is True
          assert summary['fileName'].startswith('restore-privacy-ledger-')
          path = Path('/tmp/restore-privacy-ledger') / summary['fileName']
          assert path.is_file()
          assert (path.stat().st_mode & 0o777) == 0o600
          assert (path.parent.stat().st_mode & 0o777) == 0o700
          envelope = json.loads(path.read_text(encoding='utf-8'))
          assert envelope['envelopeVersion'] == 1
          assert envelope['ledger']['sinceExclusive'] == summary['sinceExclusive']
          assert envelope['ledger']['entries'] == []
          assert envelope['signature'].startswith('hmac-sha256:')
          assert 'restore-privacy-ledger.key' not in json.dumps(envelope)
          PY
      - name: Run Playwright E2E
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee playwright-e2e.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: warn
          path: |
            playwright-e2e.log
            apps/web/playwright-report
            apps/web/test-results

  deployment-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment environment
        run: |
          cp .env.example .env
          sed -i 's/diagnostics.example.org/localhost/g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-only-secret-with-at-least-32-characters/' .env
      - name: Validate Docker Compose configuration
        run: docker compose -f infra/docker-compose.club.yml config --quiet
      - name: Verify daily backup timer rendering
        run: |
          unit_dir="$(mktemp -d)"
          MASTER_DIAGNOSTICS_SYSTEMD_DIR="$unit_dir" MASTER_DIAGNOSTICS_SKIP_SYSTEMCTL=1 \
            bash infra/backup/install-club-backup-timer.sh >/tmp/backup-timer-paths.txt
          grep -F "WorkingDirectory=${GITHUB_WORKSPACE}" "$unit_dir/master-diagnostics-backup.service"
          grep -F "ExecStart=/usr/bin/env bash ${GITHUB_WORKSPACE}/infra/backup/create-club-backup.sh" "$unit_dir/master-diagnostics-backup.service"
          grep -F 'OnCalendar=*-*-* 03:00:00' "$unit_dir/master-diagnostics-backup.timer"
          grep -F 'Persistent=true' "$unit_dir/master-diagnostics-backup.timer"
          grep -F 'WantedBy=timers.target' "$unit_dir/master-diagnostics-backup.timer"
      - name: Verify maintenance, backup and infrastructure wiring
        run: |
          docker compose --profile backup -f infra/docker-compose.club.yml config --format json > /tmp/club-compose.json
          python3 - <<'PY'
          import json

          path = "/var/lib/masters/data-subject-delivery-packages"
          with open("/tmp/club-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)

          app = config["services"]["app"]
          cleanup = config["services"]["export-cleanup"]
          retention = config["services"]["retention-scan"]
          backup = config["services"]["backup-bundle"]
          backup_verify = config["services"]["backup-verify"]
          backup_stage = config["services"]["backup-restore-stage"]
          privacy_ledger = config["services"]["backup-privacy-ledger"]
          libsql = config["services"]["libsql"]
          caddy = config["services"]["caddy"]

          assert libsql["image"] == "ghcr.io/tursodatabase/libsql-server:3ec6803"
          assert caddy["image"] == "caddy:2.11.3-alpine"
          assert all(":latest" not in service.get("image", "") for service in config["services"].values())

          assert app["environment"]["DATA_SUBJECT_DELIVERY_PACKAGE_ROOT"] == path
          assert cleanup["environment"]["DATA_SUBJECT_DELIVERY_PACKAGE_ROOT"] == path

          def source_for(service):
              matches = [
                  volume.get("source")
                  for volume in service.get("volumes", [])
                  if volume.get("target") == path
              ]
              assert len(matches) == 1, matches
              return matches[0]

          assert source_for(app) == source_for(cleanup)
          cleanup_command = cleanup.get("command", [])
          cleanup_text = " ".join(cleanup_command) if isinstance(cleanup_command, list) else str(cleanup_command)
          assert "tenant-exports:cleanup" in cleanup_text
          assert "data-subject-delivery:cleanup" in cleanup_text

          assert retention["environment"]["DATABASE_URL"] == "http://libsql:8080"
          assert retention["environment"]["RETENTION_JOB_OUTPUT"] == "summary"
          retention_command = retention.get("command", [])
          retention_text = " ".join(retention_command) if isinstance(retention_command, list) else str(retention_command)
          assert "--silent --filter @masters/db retention:scan" in retention_text
          assert "sleep 86400" in retention_text
          assert retention["depends_on"]["migrate"]["condition"] == "service_completed_successfully"

          backup_command = backup.get("command", [])
          backup_text = " ".join(backup_command) if isinstance(backup_command, list) else str(backup_command)
          assert "backup:bundle" in backup_text
          assert backup["environment"]["BACKUP_RETENTION_COUNT"] == "30"
          required_read_only_targets = {
              "/backup-source/libsql",
              "/backup-source/reports",
              "/backup-source/tenant-exports",
              "/backup-source/data-subject-delivery",
              "/backup-source/caddy-data",
              "/backup-source/caddy-config",
              "/run/secrets/backup.key",
          }
          read_only_targets = {
              volume.get("target")
              for volume in backup.get("volumes", [])
              if volume.get("read_only") is True
          }
          assert required_read_only_targets <= read_only_targets
          target_mounts = [
              volume for volume in backup.get("volumes", [])
              if volume.get("target") == "/backup-target"
          ]
          assert len(target_mounts) == 1
          assert target_mounts[0].get("read_only") is not True

          verify_command = backup_verify.get("command", [])
          verify_text = " ".join(verify_command) if isinstance(verify_command, list) else str(verify_command)
          assert "backup:verify" in verify_text
          verify_mounts = {volume.get("target"): volume for volume in backup_verify.get("volumes", [])}
          assert set(verify_mounts) == {"/backup-target", "/run/secrets/backup.key"}
          assert all(volume.get("read_only") is True for volume in verify_mounts.values())
          assert not any(str(target).startswith('/backup-source') for target in verify_mounts)

          stage_command = backup_stage.get("command", [])
          stage_text = " ".join(stage_command) if isinstance(stage_command, list) else str(stage_command)
          assert "backup:stage" in stage_text
          assert backup_stage["environment"]["RESTORE_STAGING_ROOT"] == "/restore-staging"
          stage_mounts = {volume.get("target"): volume for volume in backup_stage.get("volumes", [])}
          assert set(stage_mounts) == {"/backup-target", "/run/secrets/backup.key", "/restore-staging"}
          assert stage_mounts["/backup-target"].get("read_only") is True
          assert stage_mounts["/run/secrets/backup.key"].get("read_only") is True
          assert stage_mounts["/restore-staging"].get("read_only") is not True
          assert not any(str(target).startswith('/backup-source') for target in stage_mounts)
          production_targets = {
              "/var/lib/sqld",
              "/var/lib/masters/reports",
              "/var/lib/masters/exports",
              "/var/lib/masters/data-subject-delivery-packages",
              "/data",
              "/config",
          }
          assert production_targets.isdisjoint(stage_mounts)

          ledger_command = privacy_ledger.get("command", [])
          ledger_text = " ".join(ledger_command) if isinstance(ledger_command, list) else str(ledger_command)
          assert "backup:privacy-ledger" in ledger_text
          assert privacy_ledger["environment"]["DATABASE_URL"] == "http://libsql:8080"
          assert privacy_ledger["environment"]["RESTORE_PRIVACY_LEDGER_DIR"] == "/privacy-ledger"
          assert privacy_ledger["environment"]["RESTORE_PRIVACY_LEDGER_KEY_FILE"] == "/run/secrets/restore-privacy-ledger.key"
          ledger_mounts = {volume.get("target"): volume for volume in privacy_ledger.get("volumes", [])}
          assert set(ledger_mounts) == {
              "/restore-staging",
              "/privacy-ledger",
              "/run/secrets/restore-privacy-ledger.key",
          }
          assert ledger_mounts["/restore-staging"].get("read_only") is True
          assert ledger_mounts["/run/secrets/restore-privacy-ledger.key"].get("read_only") is True
          assert ledger_mounts["/privacy-ledger"].get("read_only") is not True
          assert production_targets.isdisjoint(ledger_mounts)
          assert privacy_ledger["depends_on"]["libsql"]["condition"] == "service_healthy"
          PY
      - name: Verify pinned infrastructure images resolve
        run: |
          docker manifest inspect ghcr.io/tursodatabase/libsql-server:3ec6803 >/dev/null
          docker manifest inspect caddy:2.11.3-alpine >/dev/null
      - name: Build migration image
        run: docker build --target migrator -f apps/web/Dockerfile -t master-diagnostics-migrator:ci .
      - name: Build production web image
        run: docker build --target runner -f apps/web/Dockerfile -t master-diagnostics-web:ci .

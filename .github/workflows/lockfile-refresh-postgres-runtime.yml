name: Refresh PostgreSQL Runtime Lockfile

on:
  push:
    branches:
      - feat/postgresql-service-runtime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postgresql-service-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile when required
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Refresh pnpm lockfile for PostgreSQL runtime'
          git push origin HEAD:feat/postgresql-service-runtime

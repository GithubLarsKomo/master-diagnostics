name: Beta Restore Evidence Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  restore-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify beta restore evidence checker contracts
        run: python3 infra/backup/test-beta-restore-drill-evidence.py

name: Restore Promotion Switch Assessment Wiring Contract

on:
  pull_request:
    paths:
      - '.github/workflows/restore-promotion-switch-assessment-wiring-contract.yml'
      - 'infra/backup/assess-club-restore-promotion-switch.sh'
      - 'infra/docker-compose.restore-promotion-assessment.yml'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'packages/db/**'
      - 'docs/restore-private-promotion-switch-assessment.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-promotion-switch-assessment-wiring-contract.yml'
      - 'infra/backup/assess-club-restore-promotion-switch.sh'
      - 'infra/docker-compose.restore-promotion-assessment.yml'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'packages/db/**'
      - 'docs/restore-private-promotion-switch-assessment.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify host assessment remains strictly read-only
        run: |
          bash -n infra/backup/assess-club-restore-promotion-switch.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path('infra/backup/assess-club-restore-promotion-switch.sh').read_text()
          active = '\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('#'))
          assert 'resolve-active-club-volumes.py' in active
          assert 'config --format json' in active
          assert 'ps -a -q "${service}"' in active
          assert 'docker inspect "${app_container_id}"' in active
          assert 'docker inspect "${libsql_container_id}"' in active
          assert 'promotion-switch-intent.json' in active
          assert 'promotion-switch-journal.json' in active
          assert 'backup-restore-promotion-switch-assess' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_LIBSQL_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_REPORTS_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_TENANT_EXPORTS_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_DATA_SUBJECT_DELIVERY_VOLUME' in active
          for token in (
              'check-club-restore-promotion-candidates.sh',
              'docker-compose.restore-promotion-selector.yml',
              'docker volume create',
              'docker volume rm',
              'docker cp ',
              'docker compose stop',
              'docker compose down',
              'docker compose up',
              'docker compose restart',
              'backup-restore-promotion-switch-event',
              'backup:restore-promotion-switch-event',
              'RESTORE_PRIVATE_PROMOTION_SWITCH_EVENT_PHASE',
          ):
              assert token not in active
          PY

      - name: Verify isolated assessment and evidence-writer services
        run: |
          cp .env.example .env
          sed -i 's/diagnostics.example.org/localhost/g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-only-secret-with-at-least-32-characters/' .env
          RESTORE_PRIVATE_PROMOTION_SWITCH_INTENT_HOST_FILE=/tmp/promotion-switch-intent.json \
          RESTORE_PRIVATE_PROMOTION_SWITCH_EVIDENCE_HOST_DIR=/tmp/promotion-switch-evidence \
            docker compose --profile backup \
              --env-file .env \
              -f infra/docker-compose.club.yml \
              -f infra/docker-compose.restore-promotion-assessment.yml \
              config --format json >/tmp/restore-switch-assessment-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/restore-switch-assessment-compose.json').read_text())
          production_targets = {
              '/candidate',
              '/restore-replay',
              '/var/run/docker.sock',
              '/var/lib/sqld',
              '/var/lib/masters/reports',
              '/var/lib/masters/exports',
              '/var/lib/masters/data-subject-delivery-packages',
              '/data',
              '/config',
          }
          expected_env = {
              'RESTORE_PRIVATE_PROMOTION_SWITCH_INTENT_FILE': '/promotion-switch-intent.json',
              'RESTORE_PRIVATE_PROMOTION_SWITCH_JOURNAL_FILE': '/switch-evidence/promotion-switch-journal.json',
              'RESTORE_PRIVATE_PROMOTION_SWITCH_EXECUTION_DIR': '/switch-evidence',
              'RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE': '/run/secrets/restore-private-promotion.key',
          }
          for service_name, command, evidence_ro in (
              ('backup-restore-promotion-switch-assess', 'backup:restore-promotion-switch-assess', True),
              ('backup-restore-promotion-switch-event', 'backup:restore-promotion-switch-event', False),
          ):
              service = config['services'][service_name]
              assert service['command'][-1] == command
              assert '--silent' in service['command']
              assert service.get('network_mode') == 'none'
              assert not service.get('depends_on')
              assert service['environment'] == expected_env
              mounts = {item['target']: item for item in service.get('volumes', [])}
              assert set(mounts) == {
                  '/run/secrets/restore-private-promotion.key',
                  '/promotion-switch-intent.json',
                  '/switch-evidence',
              }
              assert mounts['/run/secrets/restore-private-promotion.key']['read_only'] is True
              assert mounts['/promotion-switch-intent.json']['read_only'] is True
              if evidence_ro:
                  assert mounts['/switch-evidence'].get('read_only') is True
              else:
                  assert mounts['/switch-evidence'].get('read_only') is not True
              assert production_targets.isdisjoint(mounts)
          PY

      - name: Verify resolver accepts stopped-container inspect evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/restore-switch-assessment-resolver')
          root.mkdir(parents=True, exist_ok=True)
          compose = {
              'name':'infra',
              'services':{
                  'libsql':{'volumes':[{'type':'volume','source':'libsql-data','target':'/var/lib/sqld'}]},
                  'app':{'volumes':[
                      {'type':'volume','source':'report-data','target':'/var/lib/masters/reports'},
                      {'type':'volume','source':'export-data','target':'/var/lib/masters/exports'},
                      {'type':'volume','source':'data-subject-delivery-data','target':'/var/lib/masters/data-subject-delivery-packages'},
                  ]},
              },
              'volumes':{'libsql-data':{},'report-data':{},'export-data':{},'data-subject-delivery-data':{}},
          }
          app = [{'State':{'Status':'exited'},'Config':{'Labels':{'com.docker.compose.project':'infra','com.docker.compose.service':'app'}},'Mounts':[
              {'Type':'volume','Name':'candidate_reports','Destination':'/var/lib/masters/reports','RW':True},
              {'Type':'volume','Name':'candidate_exports','Destination':'/var/lib/masters/exports','RW':True},
              {'Type':'volume','Name':'candidate_delivery','Destination':'/var/lib/masters/data-subject-delivery-packages','RW':True},
          ]}]
          libsql = [{'State':{'Status':'exited'},'Config':{'Labels':{'com.docker.compose.project':'infra','com.docker.compose.service':'libsql'}},'Mounts':[
              {'Type':'volume','Name':'candidate_libsql','Destination':'/var/lib/sqld','RW':True},
          ]}]
          root.joinpath('compose.json').write_text(json.dumps(compose))
          root.joinpath('app.json').write_text(json.dumps(app))
          root.joinpath('libsql.json').write_text(json.dumps(libsql))
          PY
          python3 infra/backup/resolve-active-club-volumes.py \
            --compose-json /tmp/restore-switch-assessment-resolver/compose.json \
            --app-inspect-json /tmp/restore-switch-assessment-resolver/app.json \
            --libsql-inspect-json /tmp/restore-switch-assessment-resolver/libsql.json \
            --format lines >/tmp/resolved-stopped-volumes.txt
          diff -u <(cat <<'EOF'
          candidate_libsql
          candidate_reports
          candidate_exports
          candidate_delivery
          EOF
          ) /tmp/resolved-stopped-volumes.txt

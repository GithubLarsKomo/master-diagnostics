name: Restore RTO Drill Contract

on:
  pull_request:
    paths:
      - '.github/workflows/restore-rto-drill-contract.yml'
      - 'infra/backup/run-club-restore-rto-drill.sh'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'infra/backup/check-restore-rto-drill-report.py'
      - 'infra/backup/check-club-restore-rto-drill-report.sh'
      - '.env.example'
      - 'docs/restore-rto-drill.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-rto-drill-contract.yml'
      - 'infra/backup/run-club-restore-rto-drill.sh'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'infra/backup/check-restore-rto-drill-report.py'
      - 'infra/backup/check-club-restore-rto-drill-report.sh'
      - '.env.example'
      - 'docs/restore-rto-drill.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify drill syntax and operational ordering
        run: |
          bash -n infra/backup/run-club-restore-rto-drill.sh
          bash -n infra/backup/check-club-restore-rto-drill-report.sh
          python3 -m py_compile \
            infra/backup/write-restore-rto-drill-report.py \
            infra/backup/check-restore-rto-drill-report.py
          python3 - <<'PY'
          from pathlib import Path
          script=Path('infra/backup/run-club-restore-rto-drill.sh').read_text()
          writer=Path('infra/backup/write-restore-rto-drill-report.py').read_text()
          checker=Path('infra/backup/check-restore-rto-drill-report.py').read_text()
          host_check=Path('infra/backup/check-club-restore-rto-drill-report.sh').read_text()
          order=[
              'verify-club-backup.sh',
              'stage-club-restore.sh',
              'replay-club-restore-privacy-db.sh',
              'authorize-club-restore-promotion.sh',
              'prepare-club-restore-promotion-plan.sh',
              'prepare-club-restore-promotion-candidates.sh',
              'authorize-club-restore-promotion-switch.sh',
              'execute-club-restore-promotion-switch.sh',
          ]
          positions=[script.index(item) for item in order]
          assert positions == sorted(positions)
          assert 'flock -n 9' in script
          assert 'rtoTargetSeconds": 14400' in writer
          assert '"privacyBackupActivationAllowed": False' in writer
          assert 'masters:restore-rto-drill-report:v1' in checker
          assert 'RESTORE_RTO_DRILL_REPORT_VERIFIED' in checker
          assert 'practicalRestoreEvidenceVerified' in checker
          assert '--require-completed' in host_check
          assert '--require-rto-met' in host_check
          assert '--expected-bundle-sha256' in host_check
          for text in (script, writer, checker, host_check):
              assert 'PRIVACY_BACKUP_STATE=ENABLED' not in text
          for forbidden in ('docker volume rm', 'docker volume create', 'docker cp '):
              assert forbidden not in script
          for forbidden in ('docker ', 'subprocess.', 'os.replace('):
              assert forbidden not in checker
          PY

      - name: Exercise completed and rolled-back drill reports with mocked host chain
        run: |
          set -Eeuo pipefail
          root=/tmp/md-rto-drill-contract
          repo="$root/repo"
          backup="$root/backups"
          replay="$root/replay"
          reports="$root/reports"
          key="$root/drill.key"
          rm -rf "$root"
          mkdir -p "$repo/infra/backup" "$backup" "$replay" "$reports"
          cp infra/backup/run-club-restore-rto-drill.sh "$repo/infra/backup/"
          cp infra/backup/write-restore-rto-drill-report.py "$repo/infra/backup/"
          cp infra/backup/check-restore-rto-drill-report.py "$repo/infra/backup/"
          cp infra/backup/check-club-restore-rto-drill-report.sh "$repo/infra/backup/"

          bundle=masters-backup-20260809T120000Z-11111111-2222-3333-4444-555555555555.mdbak
          printf 'encrypted-test-bundle\n' >"$backup/$bundle"
          sha256sum "$backup/$bundle" | awk -v name="$bundle" '{print $1"  "name}' >"$backup/$bundle.sha256"
          bundle_fp="sha256:$(sha256sum "$backup/$bundle" | awk '{print $1}')"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/md-rto-drill-contract/drill.key').write_text(base64.b64encode(bytes([83])*32).decode()+'\n')
          PY
          chmod 600 "$key"

          cat >"$repo/.env" <<EOF
          BACKUP_HOST_DIR=$backup
          RESTORE_PRIVACY_REPLAY_HOST_DIR=$replay
          RESTORE_RTO_DRILL_REPORT_HOST_DIR=$reports
          RESTORE_RTO_DRILL_REPORT_KEY_FILE=$key
          MOCK_SWITCH_STATUS=COMPLETED
          EOF

          for name in verify-club-backup.sh replay-club-restore-privacy-db.sh authorize-club-restore-promotion.sh prepare-club-restore-promotion-plan.sh prepare-club-restore-promotion-candidates.sh; do
            cat >"$repo/infra/backup/$name" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exit 0
          SH
            chmod +x "$repo/infra/backup/$name"
          done

          cat >"$repo/infra/backup/stage-club-restore.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          printf '%s\n' '{"ok":true,"stagingName":"restore-20260809T120100Z-aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"}'
          SH
          chmod +x "$repo/infra/backup/stage-club-restore.sh"

          cat >"$repo/infra/backup/authorize-club-restore-promotion-switch.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          staging="$1"
          root="${RESTORE_PRIVACY_REPLAY_HOST_DIR}/${staging}/promotion/switch"
          mkdir -p "$root"
          printf '%s\n' '{"record":{"candidateSetId":"restore-0123456789abcdefabcd"}}' >"$root/promotion-switch-intent.json"
          SH
          chmod +x "$repo/infra/backup/authorize-club-restore-promotion-switch.sh"

          cat >"$repo/infra/backup/execute-club-restore-promotion-switch.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [[ "${MOCK_SWITCH_STATUS}" == COMPLETED ]]; then
            printf '%s\n' '{"mode":"CLUB_RESTORE_PROMOTION_SWITCH_EXECUTOR","status":"COMPLETED","promotionExecuted":true}'
            exit 0
          fi
          printf '%s\n' '{"mode":"CLUB_RESTORE_PROMOTION_SWITCH_EXECUTOR","status":"ROLLED_BACK","promotionExecuted":false}'
          exit 1
          SH
          chmod +x "$repo/infra/backup/execute-club-restore-promotion-switch.sh"

          bash "$repo/infra/backup/run-club-restore-rto-drill.sh" "$bundle" >"$root/completed.out"
          test "$(find "$reports" -maxdepth 1 -name 'drill-*.json' | wc -l)" -eq 1
          first="$(find "$reports" -maxdepth 1 -name 'drill-*.json' | head -n1)"
          first_id="$(basename "$first" .json)"

          python3 "$repo/infra/backup/check-restore-rto-drill-report.py" \
            --report "$first" --key-file "$key" \
            --expected-bundle-name "$bundle" --expected-bundle-sha256 "$bundle_fp" \
            --require-completed --require-rto-met >"$root/completed-check.json"
          python3 - "$root/completed-check.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='RESTORE_RTO_DRILL_REPORT_VERIFIED', r
          assert r['drillStatus']=='COMPLETED'
          assert r['rtoMet'] is True
          assert r['practicalRestoreEvidenceVerified'] is True
          assert r['privacyBackupActivationAllowed'] is False
          PY

          (cd "$repo" && bash infra/backup/check-club-restore-rto-drill-report.sh "$first_id" "$bundle") >"$root/host-check.json"
          grep -F '"status":"RESTORE_RTO_DRILL_REPORT_VERIFIED"' "$root/host-check.json"

          mkdir -p "$root/tamper"; chmod 700 "$root/tamper"
          tampered="$root/tamper/$(basename "$first")"
          cp "$first" "$tampered"; chmod 600 "$tampered"
          python3 - "$tampered" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d['record']['durationSeconds']+=1; p.write_text(json.dumps(d)+'\n'); p.chmod(0o600)
          PY
          set +e
          python3 "$repo/infra/backup/check-restore-rto-drill-report.py" --report "$tampered" --key-file "$key" >"$root/tamper-check.json"
          tamper_code=$?
          set -e
          test "$tamper_code" -ne 0
          grep -F 'RESTORE_RTO_DRILL_REPORT_SIGNATURE_MISMATCH' "$root/tamper-check.json"

          set +e
          python3 "$repo/infra/backup/check-restore-rto-drill-report.py" \
            --report "$first" --key-file "$key" \
            --expected-bundle-name "$bundle" --expected-bundle-sha256 "sha256:$(printf '0%.0s' {1..64})" >"$root/bundle-mismatch.json"
          mismatch_code=$?
          set -e
          test "$mismatch_code" -ne 0
          grep -F 'RESTORE_RTO_DRILL_BUNDLE_MISMATCH' "$root/bundle-mismatch.json"

          sed -i 's/MOCK_SWITCH_STATUS=COMPLETED/MOCK_SWITCH_STATUS=ROLLED_BACK/' "$repo/.env"
          set +e
          bash "$repo/infra/backup/run-club-restore-rto-drill.sh" "$bundle" >"$root/rolled-back.out"
          code=$?
          set -e
          test "$code" -ne 0
          test "$(find "$reports" -maxdepth 1 -name 'drill-*.json' | wc -l)" -eq 2
          second="$(find "$reports" -maxdepth 1 -name 'drill-*.json' ! -path "$first" | head -n1)"
          python3 "$repo/infra/backup/check-restore-rto-drill-report.py" --report "$second" --key-file "$key" >"$root/rollback-check.json"
          python3 - "$root/rollback-check.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='RESTORE_RTO_DRILL_REPORT_VERIFIED', r
          assert r['drillStatus']=='ROLLED_BACK'
          assert r['rtoMet'] is False
          assert r['practicalRestoreEvidenceVerified'] is False
          assert r['privacyBackupActivationAllowed'] is False
          PY
          set +e
          python3 "$repo/infra/backup/check-restore-rto-drill-report.py" \
            --report "$second" --key-file "$key" --require-completed >"$root/rollback-required.json"
          required_code=$?
          set -e
          test "$required_code" -ne 0
          grep -F 'RESTORE_RTO_DRILL_COMPLETION_REQUIRED' "$root/rollback-required.json"

      - name: Verify report permissions and no task/release gate auto-completion
        run: |
          test "$(stat -c '%a' /tmp/md-rto-drill-contract/reports)" = 700
          while IFS= read -r path; do test "$(stat -c '%a' "$path")" = 600; done < <(find /tmp/md-rto-drill-contract/reports -maxdepth 1 -name 'drill-*.json')
          grep -q -- '- \[ \] Privacy-Reconciliation, Healthcheck, kontrollierte Promotion und RTO praktisch testen' TASKS.md
          grep -q -- '- \[ \] Backup und Restore praktisch getestet wurden' TASKS.md
          grep -q '^PRIVACY_BACKUP_STATE=DISABLED$' .env.example

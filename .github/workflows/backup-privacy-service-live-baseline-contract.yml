name: Backup Privacy Service Live Baseline Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-service-live-baseline-contract.yml'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/test-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/prepare-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-live-baseline.md'
      - 'docs/backup-privacy-service-cutover-plan.md'
      - 'TASKS.md'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-service-live-baseline-contract.yml'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/test-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/prepare-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-live-baseline.md'
      - 'docs/backup-privacy-service-cutover-plan.md'
      - 'TASKS.md'
      - '.env.example'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify syntax and read-only live-baseline boundary
        run: |
          python3 -m py_compile infra/backup/backup-privacy-service-live-baseline.py
          bash -n infra/backup/test-backup-privacy-service-live-baseline.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('infra/backup/backup-privacy-service-live-baseline.py').read_text()
          assert 'masters:backup-privacy-service-live-baseline:v1' in text
          assert 'LIVE_BASELINE_PRIVACY_STATE_NOT_DISABLED' in text
          assert 'preservedContainerIds' in text
          assert 'dataVolumes' in text
          assert 'caddyVolumes' in text
          assert 'serviceCutoverExecutionAllowed' in text
          assert 'serviceCutoverExecuted' in text
          assert 'activationExecuted' in text
          for forbidden in ('docker inspect','docker ps','docker run','docker restart','docker stop','docker rm','docker volume','os.replace('):
              assert forbidden not in text, forbidden
          PY

      - name: Verify signed read-only live baseline and drift detection
        run: bash infra/backup/test-backup-privacy-service-live-baseline.sh

      - name: Verify release and mutation gates remain open
        run: |
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md
          grep -F 'serviceCutoverExecutionAllowed=true' docs/backup-privacy-service-live-baseline.md
          grep -F 'keine Service-Mutation' docs/backup-privacy-service-live-baseline.md

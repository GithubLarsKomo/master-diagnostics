name: Backup Privacy Service Live Baseline Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-service-live-baseline-contract.yml'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/prepare-club-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/backup_privacy_service_live_baseline_common.py'
      - 'infra/backup/write-backup-privacy-service-live-baseline.py'
      - 'infra/backup/check-backup-privacy-service-live-baseline.py'
      - 'infra/backup/test-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan-v2.py'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan-v2.py'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-config.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-live-baseline.md'
      - 'docs/backup-privacy-service-cutover-plan-v2.md'
      - 'TASKS.md'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-service-live-baseline-contract.yml'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/prepare-club-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/backup_privacy_service_live_baseline_common.py'
      - 'infra/backup/write-backup-privacy-service-live-baseline.py'
      - 'infra/backup/check-backup-privacy-service-live-baseline.py'
      - 'infra/backup/test-backup-privacy-service-live-baseline.sh'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan-v2.py'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan-v2.py'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-config.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-live-baseline.md'
      - 'docs/backup-privacy-service-cutover-plan-v2.md'
      - 'TASKS.md'
      - '.env.example'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify legacy v1 remains fail-closed and v2 remains Docker read-only
        run: |
          bash -n infra/backup/prepare-club-backup-privacy-service-live-baseline.sh
          bash -n infra/backup/test-backup-privacy-service-live-baseline.sh
          python3 -m py_compile \
            infra/backup/backup-privacy-service-live-baseline.py \
            infra/backup/backup_privacy_service_live_baseline_common.py \
            infra/backup/write-backup-privacy-service-live-baseline.py \
            infra/backup/check-backup-privacy-service-live-baseline.py
          python3 - <<'PY'
          from pathlib import Path
          legacy=Path('infra/backup/backup-privacy-service-live-baseline.py').read_text()
          host=Path('infra/backup/prepare-club-backup-privacy-service-live-baseline.sh').read_text()
          checker=Path('infra/backup/check-backup-privacy-service-cutover-plan-v2.py').read_text()
          planner=Path('infra/backup/prepare-backup-privacy-service-cutover-plan-v2.py').read_text()
          common=Path('infra/backup/backup_privacy_service_live_baseline_common.py').read_text()
          writer=Path('infra/backup/write-backup-privacy-service-live-baseline.py').read_text()
          baseline_checker=Path('infra/backup/check-backup-privacy-service-live-baseline.py').read_text()

          assert 'masters:backup-privacy-service-live-baseline:v1' in legacy
          assert "result.get(\"serviceCutoverExecutionAllowed\") is not True" in legacy
          assert '"serviceCutoverExecutionAllowed": False' in checker
          assert '"serviceCutoverExecutionAllowed": False' in planner

          assert 'masters:backup-privacy-service-live-baseline:v2' in writer
          assert 'TARGET_HANDOFF_VERIFIED' in common
          assert 'result.get("serviceCutoverExecutionAllowed") is not False' in common
          assert 'liveBaselineRequiredBeforeMutation' in common
          assert '"serviceCutoverExecutionAllowed": False' in writer
          assert '"serviceCutoverExecutionAllowed": True' in baseline_checker

          text='\n'.join((common, writer, baseline_checker))
          for required in ('"ps"', '"inspect"', '"config", "--format", "json"', 'RestartCount', 'StartedAt', 'PRIVACY_BACKUP_STATE'):
              assert required in text, required
          for forbidden in ('"run"', '"create"', '"start"', '"stop"', '"restart"', '"rm"', '"up"', '"down"', 'docker volume', 'os.replace('):
              assert forbidden not in text, forbidden
          assert 'docker inspect' in host and 'ps -a -q' in host
          PY

      - name: Verify legacy v1 cannot bypass the pre-baseline gate
        run: |
          cp infra/backup/test-backup-privacy-service-live-baseline.sh /tmp/v2-baseline-test.sh
          git show HEAD^:infra/backup/test-backup-privacy-service-live-baseline.sh >/tmp/legacy-v1-baseline-test.sh || true
          if test -s /tmp/legacy-v1-baseline-test.sh; then
            set +e
            bash /tmp/legacy-v1-baseline-test.sh >/tmp/legacy-live-baseline.out 2>/tmp/legacy-live-baseline.err
            code=$?
            set -e
            test "$code" -ne 0
          fi

      - name: Verify signed canonical v2 live baseline and current-state drift
        run: bash infra/backup/test-backup-privacy-service-live-baseline.sh

      - name: Verify real operational gates remain open
        run: |
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md
          grep -F 'staged target .env:' docs/backup-privacy-service-live-baseline.md
          grep -F 'currently running app:' docs/backup-privacy-service-live-baseline.md
          grep -F 'serviceCutoverExecutionAllowed=false' docs/backup-privacy-service-live-baseline.md
          grep -F 'serviceCutoverExecutionAllowed=true' docs/backup-privacy-service-live-baseline.md
          grep -F 'activationExecuted=false' docs/backup-privacy-service-live-baseline.md

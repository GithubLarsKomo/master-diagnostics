name: Backup Privacy Service Cutover Plan Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-service-cutover-plan-contract.yml'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/test-backup-privacy-service-cutover-plan.sh'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/backup/prepare-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-config.py'
      - 'infra/backup/execute-backup-privacy-activation.py'
      - 'infra/backup/backup-privacy-activation-execution.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-cutover-plan.md'
      - 'docs/backup-privacy-target-handoff.md'
      - 'TASKS.md'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-service-cutover-plan-contract.yml'
      - 'infra/backup/prepare-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan.py'
      - 'infra/backup/test-backup-privacy-service-cutover-plan.sh'
      - 'infra/backup/check-backup-privacy-target-handoff.py'
      - 'infra/backup/prepare-backup-privacy-target-handoff.py'
      - 'infra/backup/check-backup-privacy-target-config.py'
      - 'infra/backup/execute-backup-privacy-activation.py'
      - 'infra/backup/backup-privacy-activation-execution.py'
      - 'infra/docker-compose.club.yml'
      - 'docs/backup-privacy-service-cutover-plan.md'
      - 'docs/backup-privacy-target-handoff.md'
      - 'TASKS.md'
      - '.env.example'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify syntax and pre-live planning boundary
        run: |
          python3 -m py_compile \
            infra/backup/prepare-backup-privacy-service-cutover-plan.py \
            infra/backup/check-backup-privacy-service-cutover-plan.py
          bash -n infra/backup/test-backup-privacy-service-cutover-plan.sh
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(Path(p).read_text() for p in (
              'infra/backup/prepare-backup-privacy-service-cutover-plan.py',
              'infra/backup/check-backup-privacy-service-cutover-plan.py',
          ))
          assert 'serviceCutoverPlanVersion' in text
          assert 'targetHandoffFingerprint' in text
          assert 'liveBaselineRequiredBeforeMutation' in text
          assert '"activationExecuted": False' in text
          assert '"config", "--format", "json"' in text
          for forbidden in (
              '"up"', '"run"', '"restart"', '"stop"', '"down"',
              '"inspect"', '"ps"', 'docker volume', 'os.replace(',
          ):
              assert forbidden not in text, forbidden
          for legacy in ('completionPath', 'completionFingerprint', 'configurationRuntimeAttestationSha256'):
              assert legacy not in text, legacy
          PY

      - name: Verify signed deterministic handoff-bound cutover plan v2
        run: bash infra/backup/test-backup-privacy-service-cutover-plan.sh

      - name: Verify release and live-cutover gates remain open
        run: |
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md
          grep -F 'liveBaselineRequired=true' docs/backup-privacy-service-cutover-plan.md
          grep -F 'serviceCutoverExecutionAllowed=false' docs/backup-privacy-service-cutover-plan.md
          grep -F 'activationExecuted=false' docs/backup-privacy-service-cutover-plan.md

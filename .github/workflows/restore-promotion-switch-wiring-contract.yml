name: Restore Promotion Switch Wiring Contract

on:
  pull_request:
    paths:
      - '.github/workflows/restore-promotion-switch-wiring-contract.yml'
      - 'infra/backup/authorize-club-restore-promotion-switch.sh'
      - 'infra/backup/check-club-restore-promotion-candidates.sh'
      - 'infra/docker-compose.restore-promotion.yml'
      - 'packages/db/**'
      - 'docs/restore-private-promotion-switch-intent.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-promotion-switch-wiring-contract.yml'
      - 'infra/backup/authorize-club-restore-promotion-switch.sh'
      - 'infra/backup/check-club-restore-promotion-candidates.sh'
      - 'infra/docker-compose.restore-promotion.yml'
      - 'packages/db/**'
      - 'docs/restore-private-promotion-switch-intent.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit switch authorization boundary
        run: |
          bash -n infra/backup/authorize-club-restore-promotion-switch.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path('infra/backup/authorize-club-restore-promotion-switch.sh').read_text()
          active = '\n'.join(
              line for line in script.splitlines()
              if not line.lstrip().startswith('#')
          )
          assert 'check-club-restore-promotion-candidates.sh' in active
          assert 'candidate-healthcheck.json' in active
          assert 'CANDIDATE_SET_HEALTHY' in active
          assert 'switch_dir="${promotion_dir}/switch"' in active
          assert 'chmod 0700 "${switch_dir}"' in active
          assert 'backup-restore-promotion-switch-intent' in active
          assert ':/candidate-healthcheck.json:ro' in active
          healthcheck = active.index('bash "${CANDIDATE_HEALTHCHECK}"')
          normalize = active.index("out_path.write_text")
          switch_run = active.rindex('backup-restore-promotion-switch-intent')
          assert healthcheck < normalize < switch_run
          for token in (
              'docker volume create',
              'docker volume rm',
              'docker cp ',
              'docker compose down',
              'docker compose stop',
              'backup-restore-promotion-candidate-copy',
              'backup:restore-promotion-candidates-authorize',
              '/var/run/docker.sock',
              '/var/lib/sqld',
              '/var/lib/masters/reports',
              '/var/lib/masters/exports',
              '/var/lib/masters/data-subject-delivery-packages',
          ):
              assert token not in active
          PY

      - name: Verify switch intent Compose isolation
        run: |
          cp .env.example .env
          sed -i 's/diagnostics.example.org/localhost/g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-only-secret-with-at-least-32-characters/' .env
          RESTORE_STAGING_NAME=restore-unset \
            docker compose --profile backup \
              -f infra/docker-compose.club.yml \
              -f infra/docker-compose.restore-promotion.yml \
              config --format json >/tmp/restore-switch-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/restore-switch-compose.json', encoding='utf-8') as handle:
              config = json.load(handle)
          service = config['services']['backup-restore-promotion-switch-intent']
          assert service['command'][-1] == 'backup:restore-promotion-switch-intent'
          assert '--silent' in service['command']
          assert service.get('network_mode') == 'none'
          assert not service.get('depends_on')
          assert service['environment'] == {
              'RESTORE_PRIVATE_PROMOTION_CANDIDATE_HEALTHCHECK_FILE': '/candidate-healthcheck.json',
              'RESTORE_PRIVATE_PROMOTION_INTENT_DIR': '/restore-promotion-switch',
              'RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE': '/run/secrets/restore-private-promotion.key',
          }
          mounts = {item['target']: item for item in service.get('volumes', [])}
          assert set(mounts) == {
              '/run/secrets/restore-private-promotion.key',
              '/restore-promotion-switch',
          }
          assert mounts['/run/secrets/restore-private-promotion.key']['type'] == 'bind'
          assert mounts['/run/secrets/restore-private-promotion.key']['read_only'] is True
          assert mounts['/restore-promotion-switch']['type'] == 'bind'
          assert mounts['/restore-promotion-switch'].get('read_only') is not True
          assert mounts['/restore-promotion-switch']['source'].endswith(
              '/restore-privacy-replay/restore-unset/promotion/switch'
          )
          forbidden = {
              '/candidate',
              '/restore-replay',
              '/var/run/docker.sock',
              '/var/lib/sqld',
              '/var/lib/masters/reports',
              '/var/lib/masters/exports',
              '/var/lib/masters/data-subject-delivery-packages',
              '/data',
              '/config',
          }
          assert forbidden.isdisjoint(mounts)
          PY

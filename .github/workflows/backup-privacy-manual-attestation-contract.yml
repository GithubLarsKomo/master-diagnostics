name: Backup Privacy Manual Attestation Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-manual-attestation-contract.yml'
      - 'infra/backup/write-backup-privacy-manual-attestation.py'
      - 'infra/backup/check-backup-privacy-manual-attestation.py'
      - 'infra/backup/check-backup-privacy-activation-readiness.py'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'docs/backup-privacy-manual-attestation.md'
      - 'TASKS.md'
      - '.env.example'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-manual-attestation-contract.yml'
      - 'infra/backup/write-backup-privacy-manual-attestation.py'
      - 'infra/backup/check-backup-privacy-manual-attestation.py'
      - 'infra/backup/check-backup-privacy-activation-readiness.py'
      - 'infra/backup/write-restore-rto-drill-report.py'
      - 'docs/backup-privacy-manual-attestation.md'
      - 'TASKS.md'
      - '.env.example'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signed successful drill evidence and keys
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-attestation
          rm -rf "$root"
          mkdir -p "$root/reports" "$root/attestations"
          chmod 700 "$root/reports" "$root/attestations"
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          root=Path('/tmp/backup-privacy-attestation')
          root.joinpath('drill.key').write_text(base64.b64encode(bytes([83])*32).decode()+'\n')
          root.joinpath('attestation.key').write_text(base64.b64encode(bytes([91])*32).decode()+'\n')
          phases=[{'name':name,'status':'COMPLETED','durationSeconds':10,'exitCode':0} for name in (
            'VERIFY_BACKUP','STAGE_RESTORE','PRIVACY_REPLAY','AUTHORIZE_PROMOTION',
            'PREPARE_PROMOTION_PLAN','PREPARE_CANDIDATES','AUTHORIZE_SWITCH','EXECUTE_SWITCH')]
          root.joinpath('phases.json').write_text(json.dumps(phases)+'\n')
          PY
          chmod 600 "$root/drill.key" "$root/attestation.key" "$root/phases.json"
          python3 infra/backup/write-restore-rto-drill-report.py \
            --output-dir "$root/reports" \
            --key-file "$root/drill.key" \
            --drill-id drill-11111111111111111111111111111111 \
            --bundle-name masters-backup-20260809T100000Z-11111111-1111-1111-1111-111111111111.mdbak \
            --bundle-sha256 sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --staging-name restore-20260809T100100Z-22222222-2222-2222-2222-222222222222 \
            --candidate-set-id restore-0123456789abcdefabcd \
            --started-at 2026-08-09T10:00:00.000Z \
            --completed-at 2026-08-09T10:02:00.000Z \
            --duration-seconds 120 \
            --status COMPLETED \
            --terminal-phase EXECUTE_SWITCH \
            --phases-file "$root/phases.json" >/dev/null

      - name: Create and verify signed manual attestation
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-attestation
          python3 infra/backup/write-backup-privacy-manual-attestation.py \
            --readiness-checker "$GITHUB_WORKSPACE/infra/backup/check-backup-privacy-activation-readiness.py" \
            --drill-report "$root/reports/drill-11111111111111111111111111111111.json" \
            --drill-key-file "$root/drill.key" \
            --attestation-key-file "$root/attestation.key" \
            --output-dir "$root/attestations" \
            --attestation-id attestation-22222222222222222222222222222222 \
            --attestor-id ci-operator \
            --attested-at 2026-08-09T10:05:00.000Z \
            --acknowledge-operational-responsibility \
            >"$root/writer.json"
          python3 infra/backup/check-backup-privacy-manual-attestation.py \
            --attestation "$root/attestations/attestation-22222222222222222222222222222222.json" \
            --key-file "$root/attestation.key" \
            >"$root/verified.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/backup-privacy-attestation')
          writer=json.loads(root.joinpath('writer.json').read_text())
          verified=json.loads(root.joinpath('verified.json').read_text())
          assert writer['status']=='ATTESTATION_PERSISTED'
          assert writer['runtimeConfigurationChanged'] is False
          assert writer['automaticActivationPerformed'] is False
          assert verified['status']=='ATTESTATION_VERIFIED'
          assert verified['privacyBackupActivationAllowed'] is True
          assert verified['runtimeConfigurationChanged'] is False
          assert verified['automaticActivationPerformed'] is False
          assert verified['activationTarget']['PRIVACY_BACKUP_STATE']=='ENABLED'
          PY
          test "$(stat -c '%a' "$root/attestations")" = 700
          test "$(stat -c '%a' "$root/attestations/attestation-22222222222222222222222222222222.json")" = 600

      - name: Verify idempotent retry and conflicting reuse fail closed
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-attestation
          python3 infra/backup/write-backup-privacy-manual-attestation.py \
            --readiness-checker "$GITHUB_WORKSPACE/infra/backup/check-backup-privacy-activation-readiness.py" \
            --drill-report "$root/reports/drill-11111111111111111111111111111111.json" \
            --drill-key-file "$root/drill.key" --attestation-key-file "$root/attestation.key" \
            --output-dir "$root/attestations" --attestation-id attestation-22222222222222222222222222222222 \
            --attestor-id ci-operator --attested-at 2026-08-09T10:05:00.000Z \
            --acknowledge-operational-responsibility >"$root/retry.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/backup-privacy-attestation/retry.json').read_text())
          assert r['attestationCreated'] is False and r['attestationReused'] is True
          PY
          set +e
          python3 infra/backup/write-backup-privacy-manual-attestation.py \
            --readiness-checker "$GITHUB_WORKSPACE/infra/backup/check-backup-privacy-activation-readiness.py" \
            --drill-report "$root/reports/drill-11111111111111111111111111111111.json" \
            --drill-key-file "$root/drill.key" --attestation-key-file "$root/attestation.key" \
            --output-dir "$root/attestations" --attestation-id attestation-22222222222222222222222222222222 \
            --attestor-id different-operator --attested-at 2026-08-09T10:05:00.000Z \
            --acknowledge-operational-responsibility >/tmp/conflict.out 2>/tmp/conflict.err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'ATTESTATION_CONFLICT' /tmp/conflict.err

      - name: Verify explicit operational acknowledgement is mandatory
        run: |
          set +e
          root=/tmp/backup-privacy-attestation
          python3 infra/backup/write-backup-privacy-manual-attestation.py \
            --readiness-checker "$GITHUB_WORKSPACE/infra/backup/check-backup-privacy-activation-readiness.py" \
            --drill-report "$root/reports/drill-11111111111111111111111111111111.json" \
            --drill-key-file "$root/drill.key" --attestation-key-file "$root/attestation.key" \
            --output-dir "$root/attestations" --attestation-id attestation-33333333333333333333333333333333 \
            --attestor-id ci-operator --attested-at 2026-08-09T10:06:00.000Z >/tmp/no-ack.out 2>/tmp/no-ack.err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'OPERATIONAL_ACKNOWLEDGEMENT_REQUIRED' /tmp/no-ack.err

      - name: Verify HMAC or content tampering is blocked
        run: |
          set -Eeuo pipefail
          root=/tmp/backup-privacy-attestation
          mkdir -p "$root/tampered"
          cp "$root/attestations/attestation-22222222222222222222222222222222.json" \
             "$root/tampered/attestation-44444444444444444444444444444444.json"
          chmod 600 "$root/tampered/attestation-44444444444444444444444444444444.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/backup-privacy-attestation/tampered/attestation-44444444444444444444444444444444.json')
          d=json.loads(p.read_text())
          d['record']['attestorId']='tampered-operator'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          set +e
          python3 infra/backup/check-backup-privacy-manual-attestation.py \
            --attestation "$root/tampered/attestation-44444444444444444444444444444444.json" \
            --key-file "$root/attestation.key" >"$root/tampered-result.json"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/backup-privacy-attestation/tampered-result.json').read_text())
          assert r['status']=='BLOCKED'
          assert r['privacyBackupActivationAllowed'] is False
          assert r['runtimeConfigurationChanged'] is False
          PY

      - name: Verify attestation tooling cannot mutate runtime configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path('infra/backup/write-backup-privacy-manual-attestation.py'),
            Path('infra/backup/check-backup-privacy-manual-attestation.py'),
          ]
          combined='\n'.join(p.read_text() for p in paths)
          for token in ('docker compose','docker volume','sed -i','.env','PRIVACY_BACKUP_STATE=ENABLED'):
            assert token not in combined
          assert 'runtimeConfigurationChanged' in combined
          assert 'automaticActivationPerformed' in combined
          PY
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md

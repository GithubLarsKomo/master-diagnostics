name: Restore Promotion Wiring Contract

on:
  pull_request:
    paths:
      - '.github/workflows/restore-promotion-wiring-contract.yml'
      - '.env.example'
      - 'infra/backup/authorize-club-restore-promotion.sh'
      - 'infra/backup/prepare-club-restore-promotion-plan.sh'
      - 'infra/backup/prepare-club-restore-promotion-candidates.sh'
      - 'infra/backup/check-club-restore-promotion-candidates.sh'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'infra/docker-compose.club.yml'
      - 'infra/docker-compose.restore-promotion.yml'
      - 'packages/db/**'
      - 'docs/restore-private-promotion.md'
      - 'docs/restore-private-promotion-execution-plan.md'
      - 'docs/restore-private-promotion-candidates.md'
      - 'docs/restore-private-promotion-candidate-healthcheck.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-promotion-wiring-contract.yml'
      - '.env.example'
      - 'infra/backup/authorize-club-restore-promotion.sh'
      - 'infra/backup/prepare-club-restore-promotion-plan.sh'
      - 'infra/backup/prepare-club-restore-promotion-candidates.sh'
      - 'infra/backup/check-club-restore-promotion-candidates.sh'
      - 'infra/backup/resolve-active-club-volumes.py'
      - 'infra/docker-compose.club.yml'
      - 'infra/docker-compose.restore-promotion.yml'
      - 'packages/db/**'
      - 'docs/restore-private-promotion.md'
      - 'docs/restore-private-promotion-execution-plan.md'
      - 'docs/restore-private-promotion-candidates.md'
      - 'docs/restore-private-promotion-candidate-healthcheck.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit host authorization boundary
        run: |
          bash -n infra/backup/authorize-club-restore-promotion.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('infra/backup/authorize-club-restore-promotion.sh').read_text()
          active = '\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('#'))
          assert 'docker-compose.restore-promotion.yml' in active
          assert 'backup-restore-promotion-intent' in active
          assert 'backup-privacy-replay-migrate' in active
          assert 'RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE' in active
          assert 'RESTORE_PRIVATE_RECOVERY_INTENT_KEY_FILE' in active
          assert 'promotion_dir="${workspace}/promotion"' in active
          assert 'chmod 0700 "${promotion_dir}"' in active
          assert 'RESTORE_STAGING_MANIFEST=/restore-staging/${staging_name}/manifest.json' in active
          for service in (
              'backup-privacy-artifact-plan',
              'backup-privacy-replay ',
              'backup-privacy-artifact-replay',
              'backup-restore-recovery-plan',
              'backup-restore-recovery-execute',
          ):
              assert service not in active
          assert active.rindex('backup-privacy-replay-migrate') < active.rindex('backup-restore-promotion-intent')
          PY

      - name: Verify read-only active volume resolver
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/restore-volume-resolution')
          root.mkdir(parents=True, exist_ok=True)
          compose = {
              'name': 'infra',
              'services': {
                  'libsql': {'volumes': [
                      {'type': 'volume', 'source': 'libsql-data', 'target': '/var/lib/sqld'}
                  ]},
                  'app': {'volumes': [
                      {'type': 'volume', 'source': 'report-data', 'target': '/var/lib/masters/reports'},
                      {'type': 'volume', 'source': 'export-data', 'target': '/var/lib/masters/exports'},
                      {'type': 'volume', 'source': 'data-subject-delivery-data', 'target': '/var/lib/masters/data-subject-delivery-packages'},
                  ]},
              },
              'volumes': {
                  'libsql-data': {},
                  'report-data': {},
                  'export-data': {},
                  'data-subject-delivery-data': {},
              },
          }
          app = [{
              'Config': {'Labels': {
                  'com.docker.compose.project': 'infra',
                  'com.docker.compose.service': 'app',
              }},
              'Mounts': [
                  {'Type': 'volume', 'Name': 'infra_report-data', 'Destination': '/var/lib/masters/reports', 'RW': True},
                  {'Type': 'volume', 'Name': 'infra_export-data', 'Destination': '/var/lib/masters/exports', 'RW': True},
                  {'Type': 'volume', 'Name': 'infra_data-subject-delivery-data', 'Destination': '/var/lib/masters/data-subject-delivery-packages', 'RW': True},
              ],
          }]
          libsql = [{
              'Config': {'Labels': {
                  'com.docker.compose.project': 'infra',
                  'com.docker.compose.service': 'libsql',
              }},
              'Mounts': [
                  {'Type': 'volume', 'Name': 'infra_libsql-data', 'Destination': '/var/lib/sqld', 'RW': True},
              ],
          }]
          root.joinpath('compose.json').write_text(json.dumps(compose))
          root.joinpath('app.json').write_text(json.dumps(app))
          root.joinpath('libsql.json').write_text(json.dumps(libsql))
          PY
          python3 infra/backup/resolve-active-club-volumes.py \
            --compose-json /tmp/restore-volume-resolution/compose.json \
            --app-inspect-json /tmp/restore-volume-resolution/app.json \
            --libsql-inspect-json /tmp/restore-volume-resolution/libsql.json \
            --format lines > /tmp/resolved-volumes.txt
          diff -u <(cat <<'EOF'
          infra_libsql-data
          infra_report-data
          infra_export-data
          infra_data-subject-delivery-data
          EOF
          ) /tmp/resolved-volumes.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/restore-volume-resolution/app.json')
          data = json.loads(path.read_text())
          data[0]['Config']['Labels']['com.docker.compose.project'] = 'different-project'
          path.write_text(json.dumps(data))
          PY
          if python3 infra/backup/resolve-active-club-volumes.py \
            --compose-json /tmp/restore-volume-resolution/compose.json \
            --app-inspect-json /tmp/restore-volume-resolution/app.json \
            --libsql-inspect-json /tmp/restore-volume-resolution/libsql.json; then
            echo 'Resolver unexpectedly accepted a container from a different Compose project.' >&2
            exit 1
          fi

      - name: Verify promotion plan host boundary
        run: |
          bash -n infra/backup/prepare-club-restore-promotion-plan.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('infra/backup/prepare-club-restore-promotion-plan.sh').read_text()
          active = '\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('#'))
          assert 'config --format json' in active
          assert 'ps -q "${service}"' in active
          assert 'docker inspect "${app_container_id}"' in active
          assert 'docker inspect "${libsql_container_id}"' in active
          assert 'resolve-active-club-volumes.py' in active
          assert 'backup-privacy-replay-migrate' in active
          assert 'backup-restore-promotion-plan' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_LIBSQL_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_REPORTS_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_TENANT_EXPORTS_VOLUME' in active
          assert 'RESTORE_PRIVATE_PROMOTION_ACTIVE_DATA_SUBJECT_DELIVERY_VOLUME' in active
          assert 'promotion-intent.json' in active
          for token in (
              'docker volume create',
              'docker volume rm',
              'docker cp ',
              'docker compose down',
              'backup-privacy-artifact-plan',
              'backup-privacy-replay ',
              'backup-privacy-artifact-replay',
              'backup-restore-recovery-execute',
          ):
              assert token not in active
          assert active.rindex('backup-privacy-replay-migrate') < active.rindex('backup-restore-promotion-plan')
          PY

      - name: Verify candidate preparation host mutation boundary
        run: |
          bash -n infra/backup/prepare-club-restore-promotion-candidates.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('infra/backup/prepare-club-restore-promotion-candidates.sh').read_text()
          active = '\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('#'))
          assert 'promotion-intent.json' in active
          assert 'promotion-execution-plan.json' in active
          assert 'backup:restore-promotion-candidates-authorize' in active
          assert 'CANDIDATE_COPY_AUTHORIZED' in active
          assert 'candidateMutationAllowed' in active
          assert 'productionMutationAllowed' in active
          assert 'cleanup_private_db' in active
          assert 'docker volume create' in active
          assert 'docker volume inspect' in active
          assert 'docker ps -aq --filter "volume=${candidate_volume}"' in active
          assert 'com.master-diagnostics.restore.plan-fingerprint' in active
          assert 'com.master-diagnostics.restore.rollback-volume' in active
          assert 'backup-restore-promotion-candidate-copy' in active
          assert '--no-deps' in active
          authorize = active.index('backup:restore-promotion-candidates-authorize')
          stop_db = active.index('cleanup_private_db', authorize)
          create_volume = active.index('docker volume create', stop_db)
          copy_candidate = active.rindex('backup-restore-promotion-candidate-copy')
          assert authorize < stop_db < create_volume < copy_candidate
          for token in (
              'docker volume rm',
              'docker cp ',
              'docker compose down',
              'backup-privacy-artifact-plan',
              'backup-privacy-replay ',
              'backup-privacy-artifact-replay',
              'backup-restore-recovery-execute',
              '-v "${active_',
          ):
              assert token not in active
          PY

      - name: Verify candidate-set healthcheck host read-only boundary
        run: |
          bash -n infra/backup/check-club-restore-promotion-candidates.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path('infra/backup/check-club-restore-promotion-candidates.sh').read_text()
          active = '\n'.join(line for line in script.splitlines() if not line.lstrip().startswith('#'))
          assert 'promotion-intent.json' in active
          assert 'promotion-execution-plan.json' in active
          assert 'backup:restore-promotion-candidates-preflight' in active
          assert 'CANDIDATE_SET_CHECK_READY' in active
          assert 'candidateMutationAllowed' in active
          assert 'productionMutationAllowed' in active
          assert 'cleanup_private_db' in active
          assert 'docker volume inspect' in active
          assert 'docker ps -aq --filter "volume=${candidate_volume}"' in active
          assert 'com.master-diagnostics.restore.plan-fingerprint' in active
          assert 'com.master-diagnostics.restore.rollback-volume' in active
          assert 'backup-restore-promotion-candidate-check' in active
          assert 'CANDIDATE_SET_HEALTHY' in active
          assert 'candidateSetFingerprint' in active
          preflight = active.index('backup:restore-promotion-candidates-preflight')
          stop_db = active.index('cleanup_private_db', preflight)
          inspect_volume = active.index('docker volume inspect', stop_db)
          check_candidate = active.rindex('backup-restore-promotion-candidate-check')
          assert preflight < stop_db < inspect_volume < check_candidate
          for token in (
              'docker volume create',
              'docker volume rm',
              'docker cp ',
              'docker compose down',
              'backup:restore-promotion-candidates-authorize',
              'backup-restore-promotion-candidate-copy',
              'backup-privacy-artifact-plan',
              'backup-privacy-replay ',
              'backup-privacy-artifact-replay',
              'backup-restore-recovery-execute',
              '-v "${active_',
          ):
              assert token not in active
          PY

      - name: Verify isolated promotion Compose contract
        run: |
          cp .env.example .env
          sed -i 's/diagnostics.example.org/localhost/g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-only-secret-with-at-least-32-characters/' .env
          RESTORE_PRIVATE_PROMOTION_CANDIDATE_VOLUME=restore-promotion-candidate-contract \
            docker compose --profile backup \
              -f infra/docker-compose.club.yml \
              -f infra/docker-compose.restore-promotion.yml \
              config --format json > /tmp/restore-promotion-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          with open('/tmp/restore-promotion-compose.json', encoding='utf-8') as handle:
              config = json.load(handle)
          expected_targets = {
              '/restore-staging',
              '/privacy-ledger',
              '/run/secrets/restore-privacy-ledger.key',
              '/privacy-effect-journal',
              '/run/secrets/restore-privacy-effect-journal.key',
              '/run/secrets/restore-private-promotion.key',
              '/restore-replay',
              '/restore-replay/promotion',
          }
          production_targets = {
              '/var/lib/sqld',
              '/var/lib/masters/reports',
              '/var/lib/masters/exports',
              '/var/lib/masters/data-subject-delivery-packages',
              '/data',
              '/config',
              '/var/run/docker.sock',
          }
          for service_name, command in (
              ('backup-restore-promotion-intent', 'backup:restore-promotion-intent'),
              ('backup-restore-promotion-plan', 'backup:restore-promotion-plan'),
          ):
              service = config['services'][service_name]
              assert service['environment']['DATABASE_URL'] == 'http://backup-privacy-replay-db:8080'
              assert service['environment']['DATABASE_AUTH_TOKEN'] == ''
              assert service['environment']['RESTORE_PRIVACY_ARTIFACT_MANIFEST_FILE'] == '/restore-replay/artifact-replay-manifest.json'
              assert service['environment']['RESTORE_PRIVACY_ARTIFACT_RESULT_FILE'] == '/restore-replay/artifact-replay-result.json'
              assert service['environment']['RESTORE_PRIVACY_REPORT_ROOT'] == '/restore-replay/reports'
              assert service['environment']['RESTORE_PRIVACY_TENANT_EXPORT_ROOT'] == '/restore-replay/tenant-exports'
              assert service['environment']['RESTORE_PRIVACY_DATA_SUBJECT_DELIVERY_ROOT'] == '/restore-replay/data-subject-delivery'
              assert service['environment']['RESTORE_PRIVATE_RECOVERY_PLAN_FILE'] == '/restore-replay/recovery-plan.json'
              assert service['environment']['RESTORE_PRIVATE_RECOVERY_INTENT_DIR'] == '/restore-replay/recovery-execution'
              assert service['environment']['RESTORE_PRIVATE_PROMOTION_INTENT_DIR'] == '/restore-replay/promotion'
              assert service['environment']['RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE'] == '/run/secrets/restore-private-promotion.key'
              assert service['command'][-1] == command
              assert set(service.get('networks', {})) == {'restore-internal'}
              assert config['networks']['restore-internal']['internal'] is True
              assert set(service.get('depends_on', {})) == {'backup-privacy-replay-db'}
              assert service['depends_on']['backup-privacy-replay-db']['condition'] == 'service_healthy'
              mounts = {volume.get('target'): volume for volume in service.get('volumes', [])}
              assert set(mounts) == expected_targets
              for target, volume in mounts.items():
                  assert volume.get('type') == 'bind'
                  if target == '/restore-replay/promotion':
                      assert volume.get('read_only') is not True
                      assert volume['source'].endswith('/restore-privacy-replay/restore-unset/promotion')
                  else:
                      assert volume.get('read_only') is True
              assert mounts['/restore-replay']['source'].endswith('/restore-privacy-replay/restore-unset')
              assert '/run/secrets/restore-private-recovery-intent.key' not in mounts
              assert production_targets.isdisjoint(mounts)

          plan = config['services']['backup-restore-promotion-plan']
          assert plan['environment']['RESTORE_PRIVATE_PROMOTION_INTENT_FILE'] == '/restore-replay/promotion/promotion-intent.json'
          for forbidden_env in (
              'RESTORE_PRIVATE_PROMOTION_ACTIVE_LIBSQL_VOLUME',
              'RESTORE_PRIVATE_PROMOTION_ACTIVE_REPORTS_VOLUME',
              'RESTORE_PRIVATE_PROMOTION_ACTIVE_TENANT_EXPORTS_VOLUME',
              'RESTORE_PRIVATE_PROMOTION_ACTIVE_DATA_SUBJECT_DELIVERY_VOLUME',
          ):
              assert forbidden_env not in plan['environment']

          for service_name, command, candidate_ro in (
              ('backup-restore-promotion-candidate-copy', 'backup:restore-promotion-candidate-copy', False),
              ('backup-restore-promotion-candidate-check', 'backup:restore-promotion-candidate-check', True),
          ):
              service = config['services'][service_name]
              assert service['command'][-1] == command
              assert '--silent' in service['command']
              assert service.get('network_mode') == 'none'
              assert not service.get('depends_on')
              mounts = {volume.get('target'): volume for volume in service.get('volumes', [])}
              assert set(mounts) == {'/restore-replay', '/candidate'}
              assert mounts['/restore-replay']['type'] == 'bind'
              assert mounts['/restore-replay']['read_only'] is True
              assert mounts['/candidate']['type'] == 'volume'
              assert mounts['/candidate'].get('read_only') is candidate_ro
              assert mounts['/candidate']['source'] == 'restore-promotion-candidate'
              assert production_targets.isdisjoint(mounts)
          candidate = config['volumes']['restore-promotion-candidate']
          assert candidate['external'] is True
          assert candidate['name'] == 'restore-promotion-candidate-contract'

          env = Path('.env.example').read_text()
          assert 'RESTORE_PRIVATE_PROMOTION_INTENT_KEY_FILE=/etc/master-diagnostics/restore-private-promotion.key' in env
          PY

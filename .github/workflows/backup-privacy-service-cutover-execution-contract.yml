name: Backup Privacy Service Cutover Execution Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-service-cutover-execution-contract.yml'
      - 'infra/backup/backup-privacy-service-cutover-execution.py'
      - 'infra/backup/test-backup-privacy-service-cutover-execution.sh'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan-v2.py'
      - 'docs/backup-privacy-service-cutover-execution.md'
      - '.env.example'
      - 'TASKS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-service-cutover-execution-contract.yml'
      - 'infra/backup/backup-privacy-service-cutover-execution.py'
      - 'infra/backup/test-backup-privacy-service-cutover-execution.sh'
      - 'infra/backup/backup-privacy-service-live-baseline.py'
      - 'infra/backup/check-backup-privacy-service-cutover-plan-v2.py'
      - 'docs/backup-privacy-service-cutover-execution.md'
      - '.env.example'
      - 'TASKS.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify syntax and non-mutating execution-evidence boundary
        run: |
          bash -n infra/backup/test-backup-privacy-service-cutover-execution.sh
          python3 -m py_compile infra/backup/backup-privacy-service-cutover-execution.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('infra/backup/backup-privacy-service-cutover-execution.py').read_text()
          assert 'masters:backup-privacy-service-cutover-execution-journal:v1' in text
          assert 'masters:backup-privacy-service-cutover-execution-event:v1' in text
          assert 'CUTOVER_STARTED' in text
          assert 'ROLLBACK_STARTED' in text
          assert 'RECOVER_TARGET_RECREATED' in text
          assert 'RECOVER_ROLLBACK_RECREATED' in text
          assert 'MIXED_KNOWN' in text
          for forbidden in ('docker compose', 'docker inspect', 'docker volume', 'os.replace('):
              assert forbidden not in text, forbidden
          PY

      - name: Verify success, partial target, crash recovery, rollback and tamper paths
        run: bash infra/backup/test-backup-privacy-service-cutover-execution.sh

      - name: Verify release boundary remains open
        run: |
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md

name: Backup Privacy Service Live Runtime Attestation Contract

on:
  pull_request:
    paths:
      - '.github/workflows/backup-privacy-service-live-runtime-attestation-contract.yml'
      - 'infra/backup/backup-privacy-service-live-runtime-attestation.py'
      - 'infra/backup/test-backup-privacy-service-live-runtime-attestation.sh'
      - 'infra/backup/backup-privacy-service-cutover-execution.py'
      - 'infra/backup/test-backup-privacy-service-cutover-execution.sh'
      - 'docs/backup-privacy-service-live-runtime-attestation.md'
      - '.env.example'
      - 'TASKS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-privacy-service-live-runtime-attestation-contract.yml'
      - 'infra/backup/backup-privacy-service-live-runtime-attestation.py'
      - 'infra/backup/test-backup-privacy-service-live-runtime-attestation.sh'
      - 'infra/backup/backup-privacy-service-cutover-execution.py'
      - 'infra/backup/test-backup-privacy-service-cutover-execution.sh'
      - 'docs/backup-privacy-service-live-runtime-attestation.md'
      - '.env.example'
      - 'TASKS.md'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify syntax and read-only boundary
        run: |
          python3 -m py_compile infra/backup/backup-privacy-service-live-runtime-attestation.py
          bash -n infra/backup/test-backup-privacy-service-live-runtime-attestation.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('infra/backup/backup-privacy-service-live-runtime-attestation.py').read_text()
          assert 'masters:backup-privacy-service-live-runtime-attestation:v1' in text
          assert 'boundedLiveState' in text
          assert 'SERVICE_LIVE_BASELINE_VERIFIED' not in text or 'verify_baseline_authorization' in text
          for forbidden in ('"docker"', 'docker compose', 'subprocess.', 'os.replace(', 'force-recreate'):
              assert forbidden not in text, forbidden
          PY

      - name: Verify signed target and rollback runtime attestations
        run: bash infra/backup/test-backup-privacy-service-live-runtime-attestation.sh

      - name: Verify documentation and real gates remain open
        run: |
          grep -F 'masters:backup-privacy-service-live-runtime-attestation:v1' docs/backup-privacy-service-live-runtime-attestation.md
          grep -F 'Nicht-Privacy-Environment-Werte' docs/backup-privacy-service-live-runtime-attestation.md
          grep -F 'PRIVACY_BACKUP_STATE=DISABLED' .env.example
          grep -F -- '- [ ] Restore-Drill und RTO-Test' TASKS.md
          grep -F -- '- [ ] Backup und Restore praktisch getestet wurden' TASKS.md
